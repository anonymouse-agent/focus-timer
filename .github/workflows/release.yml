name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Check tag and package versions
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version '$tagVersion' does not match package version '$packageVersion'."
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Build Windows packages
        run: npm run package:win

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $artifacts = @(
            "release/Focus-Timer-Setup-$version-windows-x64.exe",
            "release/Focus-Timer-$version-windows-x64.zip"
          )
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath $artifact)) {
              throw "Missing release artifact: $artifact"
            }
            $item = Get-Item -LiteralPath $artifact
            $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath "$($item.FullName).sha256" -Value "$hash *$($item.Name)" -Encoding ascii
          }

      - name: Publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $assets = @(
            "release/Focus-Timer-Setup-$version-windows-x64.exe",
            "release/Focus-Timer-Setup-$version-windows-x64.exe.sha256",
            "release/Focus-Timer-$version-windows-x64.zip",
            "release/Focus-Timer-$version-windows-x64.zip.sha256"
          )
          gh release create "${{ github.ref_name }}" $assets `
            --verify-tag `
            --prerelease `
            --title "Focus Timer $version" `
            --notes-file "docs/RELEASE_NOTES.md"
